<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsche Sprachausgabe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #fee 0%, #ffd 50%, #f5f5f5 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #dd0000 0%, #ffce00 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .stop-btn {
            background: #dd0000;
        }
        select, input[type="range"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .settings {
            margin-top: 20px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            display: none;
        }
        .settings.show {
            display: block;
        }
        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
            color: #333;
        }
        .info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            color: #0066cc;
        }
        .error {
            background: #fee;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #c00;
            display: none;
        }
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔊 Text zu Sprache</h1>
        <div class="subtitle">Deutsche Sprachausgabe</div>
        
        <div id="error" class="error"></div>
        
        <textarea id="textInput" placeholder="Geben Sie hier Ihren deutschen Text ein...">Guten Tag! Dies ist ein Test der deutschen Sprachausgabe.</textarea>
        
        <button id="speakBtn">▶ Abspielen</button>
        <button id="settingsBtn" style="background: #666;">⚙️ Einstellungen</button>
        
        <div id="settings" class="settings">
            <label>Stimme:</label>
            <select id="voiceSelect"></select>
            
            <label>Geschwindigkeit: <span id="rateLabel">1.0</span>x</label>
            <input type="range" id="rateInput" min="0.5" max="2" step="0.1" value="1">
            
            <label>Tonhöhe: <span id="pitchLabel">1.0</span></label>
            <input type="range" id="pitchInput" min="0.5" max="2" step="0.1" value="1">
        </div>
        
        <div class="info">
            <strong>💡 Tipps:</strong><br>
            • Stellen Sie sicher, dass Ihr Gerät nicht stummgeschaltet ist<br>
            • Chrome und Edge bieten die besten deutschen Stimmen<br>
            • Klicken Sie auf "Einstellungen" um die Stimme anzupassen
        </div>
    </div>

    <script>
        let speaking = false;
        let utterance = null;
        
        const textInput = document.getElementById('textInput');
        const speakBtn = document.getElementById('speakBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settings = document.getElementById('settings');
        const voiceSelect = document.getElementById('voiceSelect');
        const rateInput = document.getElementById('rateInput');
        const pitchInput = document.getElementById('pitchInput');
        const rateLabel = document.getElementById('rateLabel');
        const pitchLabel = document.getElementById('pitchLabel');
        const errorDiv = document.getElementById('error');

        // Check browser support
        if (!window.speechSynthesis) {
            errorDiv.textContent = '❌ Ihr Browser unterstützt keine Sprachausgabe. Bitte verwenden Sie Chrome, Edge oder Firefox.';
            errorDiv.classList.add('show');
            speakBtn.disabled = true;
        }

        // Load voices
        function loadVoices() {
            const voices = speechSynthesis.getVoices();
            const germanVoices = voices.filter(v => v.lang.startsWith('de'));
            
            voiceSelect.innerHTML = '';
            
            if (germanVoices.length === 0) {
                voiceSelect.innerHTML = '<option>Keine deutschen Stimmen verfügbar</option>';
            } else {
                germanVoices.forEach(voice => {
                    const option = document.createElement('option');
                    option.value = voice.name;
                    option.textContent = voice.name + ' (' + voice.lang + ')';
                    voiceSelect.appendChild(option);
                });
            }
        }

        // Load voices when available
        loadVoices();
        speechSynthesis.onvoiceschanged = loadVoices;

        // Settings toggle
        settingsBtn.onclick = function() {
            settings.classList.toggle('show');
        };

        // Update labels
        rateInput.oninput = function() {
            rateLabel.textContent = this.value;
        };

        pitchInput.oninput = function() {
            pitchLabel.textContent = this.value;
        };

        // Speak function
        function speak() {
            const text = textInput.value.trim();
            
            if (!text) {
                errorDiv.textContent = '⚠️ Bitte geben Sie Text ein.';
                errorDiv.classList.add('show');
                return;
            }

            speechSynthesis.cancel();
            
            utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';
            utterance.rate = parseFloat(rateInput.value);
            utterance.pitch = parseFloat(pitchInput.value);
            
            const voices = speechSynthesis.getVoices();
            const selectedVoice = voices.find(v => v.name === voiceSelect.value);
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            utterance.onstart = function() {
                speaking = true;
                speakBtn.textContent = '⏹ Stoppen';
                speakBtn.className = 'stop-btn';
                errorDiv.classList.remove('show');
            };

            utterance.onend = function() {
                speaking = false;
                speakBtn.textContent = '▶ Abspielen';
                speakBtn.className = '';
            };

            utterance.onerror = function(e) {
                speaking = false;
                speakBtn.textContent = '▶ Abspielen';
                speakBtn.className = '';
                errorDiv.textContent = '❌ Fehler: ' + e.error;
                errorDiv.classList.add('show');
            };

            speechSynthesis.speak(utterance);
        }

        function stop() {
            speechSynthesis.cancel();
            speaking = false;
            speakBtn.textContent = '▶ Abspielen';
            speakBtn.className = '';
        }

        speakBtn.onclick = function() {
            if (speaking) {
                stop();
            } else {
                speak();
            }
        };
    </script>
</body>
</html>
