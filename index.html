<!DOCTYPE html>
<html dir="rtl" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جمل ألمانية قصيرة للحياة اليومية</title>

    <!-- ResponsiveVoice API -->
    <script src="https://code.responsivevoice.org/responsivevoice.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <button class="dark-mode-toggle" id="darkModeToggle" onclick="toggleDarkMode()">
        🌙
    </button>

    

    <div class="container">
        <p class="subtitle">🗣️ اضغط 🔊 للاستماع</p>

        <div class="level-filter">
            <div style="display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
                <button class="level-filter-btn active" onclick="filterByLevel('all')">
                    الكل
                </button>
                <button class="level-filter-btn level-A1" onclick="filterByLevel('A1')">
                    A1 - مبتدئ
                </button>
                <button class="level-filter-btn level-A2" onclick="filterByLevel('A2')">
                    A2 - ابتدائي
                </button>
                <button class="level-filter-btn level-B1" onclick="filterByLevel('B1')">
                    B1 - متوسط
                </button>
                <button class="level-filter-btn level-B2" onclick="filterByLevel('B2')">
                    B2 - متوسط متقدم
                </button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-button" onclick="openTab(event, 'favorites')">⭐ مفضلة (<span id="favCount">0</span>)</button>
            <button class="tab-button active" onclick="openTab(event, 'shopping')">🏪 تسوق</button>
            <button class="tab-button" onclick="openTab(event, 'transport')">🚌 مواصلات</button>
            <button class="tab-button" onclick="openTab(event, 'restaurant')">🍽️ مطعم</button>
            <button class="tab-button" onclick="openTab(event, 'daily')">💬 يومية</button>
            <button class="tab-button" onclick="openTab(event, 'doctor')">🏥 طبيب</button>
            <button class="tab-button" onclick="openTab(event, 'work')">💼 عمل</button>
            <button class="tab-button" onclick="openTab(event, 'home')">🏠 بيت</button>
            <button class="tab-button" onclick="openTab(event, 'phone')">📞 هاتف</button>
            <button class="tab-button" onclick="openTab(event, 'emergency')">🆘 طوارئ</button>
        </div>

        <div id="favorites" class="tab-content">
            <div class="sentences-grid" id="favoritesGrid"></div>
            <div id="noFavorites" class="no-results">لا توجد جمل مفضلة</div>
        </div>

        

        <div id="shopping" class="tab-content active">
            <div class="sentences-grid"></div>
        </div>

        <div id="transport" class="tab-content">
            <div class="sentences-grid"></div>
        </div>

        <div id="restaurant" class="tab-content">
            <div class="sentences-grid"></div>
        </div>

        <div id="daily" class="tab-content">
            <div class="sentences-grid"></div>
        </div>

        <div id="doctor" class="tab-content">
            <div class="sentences-grid"></div>
        </div>

        <div id="work" class="tab-content">
            <div class="sentences-grid"></div>
        </div>

        <div id="home" class="tab-content">
            <div class="sentences-grid"></div>
        </div>

        <div id="phone" class="tab-content">
            <div class="sentences-grid"></div>
        </div>

        <div id="emergency" class="tab-content">
            <div class="sentences-grid"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
