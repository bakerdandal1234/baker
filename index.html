<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsche Sprachausgabe - Text zu Sprache</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Lucide Icons as SVG components
        const Volume2 = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
        );

        const Square = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            </svg>
        );

        const Settings = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 1v6m0 6v6m-9-9h6m6 0h6"></path>
                <path d="M19.07 4.93l-4.24 4.24m0 5.66l4.24 4.24M4.93 4.93l4.24 4.24m0 5.66l-4.24 4.24"></path>
            </svg>
        );

        const AlertCircle = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );

        function GermanTTS() {
            const [text, setText] = useState('Guten Tag! Dies ist ein Test der deutschen Sprachausgabe.');
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [voices, setVoices] = useState([]);
            const [selectedVoice, setSelectedVoice] = useState('');
            const [rate, setRate] = useState(1);
            const [pitch, setPitch] = useState(1);
            const [showSettings, setShowSettings] = useState(false);
            const [isSupported, setIsSupported] = useState(true);
            const [error, setError] = useState('');

            useEffect(() => {
                if (!('speechSynthesis' in window)) {
                    setIsSupported(false);
                    return;
                }

                const loadVoices = () => {
                    const availableVoices = window.speechSynthesis.getVoices();
                    const germanVoices = availableVoices.filter(voice => 
                        voice.lang.startsWith('de')
                    );
                    
                    setVoices(germanVoices);
                    
                    if (germanVoices.length > 0 && !selectedVoice) {
                        setSelectedVoice(germanVoices[0].name);
                    }
                };

                loadVoices();
                
                if (window.speechSynthesis.onvoiceschanged !== undefined) {
                    window.speechSynthesis.onvoiceschanged = loadVoices;
                }

                setTimeout(loadVoices, 100);
                setTimeout(loadVoices, 500);
            }, []);

            const speak = () => {
                if (!('speechSynthesis' in window)) {
                    setError('Ihr Browser unterstützt keine Text-zu-Sprache-Funktion');
                    return;
                }

                try {
                    window.speechSynthesis.cancel();
                    
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'de-DE';
                    utterance.rate = rate;
                    utterance.pitch = pitch;
                    utterance.volume = 1;
                    
                    if (selectedVoice && voices.length > 0) {
                        const voice = voices.find(v => v.name === selectedVoice);
                        if (voice) {
                            utterance.voice = voice;
                        }
                    }
                    
                    utterance.onstart = () => {
                        setIsSpeaking(true);
                        setError('');
                    };
                    
                    utterance.onend = () => {
                        setIsSpeaking(false);
                    };
                    
                    utterance.onerror = (event) => {
                        setIsSpeaking(false);
                        setError(`Fehler: ${event.error}`);
                        console.error('Speech error:', event);
                    };
                    
                    window.speechSynthesis.speak(utterance);
                    
                } catch (err) {
                    setError(`Es ist ein Fehler aufgetreten: ${err.message}`);
                    setIsSpeaking(false);
                }
            };

            const stop = () => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
                setIsSpeaking(false);
            };

            if (!isSupported) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-red-50 via-yellow-50 to-gray-50 p-6 flex items-center justify-center">
                        <div className="bg-white rounded-lg shadow-lg p-8 max-w-md">
                            <div className="flex items-center gap-3 text-red-600 mb-4">
                                <AlertCircle size={32} />
                                <h2 className="text-xl font-bold">Nicht unterstützt</h2>
                            </div>
                            <p className="text-gray-700">
                                Entschuldigung, Ihr aktueller Browser unterstützt die Text-zu-Sprache-Funktion nicht. Bitte verwenden Sie einen modernen Browser wie Chrome, Edge oder Firefox.
                            </p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-red-50 via-yellow-50 to-gray-50 p-6">
                    <div className="max-w-3xl mx-auto">
                        <div className="bg-white rounded-lg shadow-lg p-8">
                            <div className="flex items-center gap-3 mb-6">
                                <div className="w-12 h-12 bg-gradient-to-br from-black via-red-600 to-yellow-400 rounded-lg flex items-center justify-center">
                                    <Volume2 className="text-white" size={24} />
                                </div>
                                <div>
                                    <h1 className="text-3xl font-bold text-gray-800">Text zu Sprache</h1>
                                    <p className="text-sm text-gray-600">Deutsche Sprachausgabe</p>
                                </div>
                            </div>

                            {error && (
                                <div className="mb-4 bg-red-50 border border-red-200 rounded-lg p-4 flex items-start gap-2">
                                    <AlertCircle className="text-red-600 flex-shrink-0 mt-0.5" size={20} />
                                    <p className="text-sm text-red-800">{error}</p>
                                </div>
                            )}

                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">
                                        Deutscher Text
                                    </label>
                                    <textarea
                                        value={text}
                                        onChange={(e) => setText(e.target.value)}
                                        className="w-full h-48 p-4 border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all resize-none"
                                        placeholder="Geben Sie hier Ihren deutschen Text ein..."
                                    />
                                    <p className="text-xs text-gray-500 mt-1">
                                        {text.length} Zeichen
                                    </p>
                                </div>

                                <div className="flex gap-3">
                                    <button
                                        onClick={isSpeaking ? stop : speak}
                                        disabled={!text.trim()}
                                        className={`flex-1 flex items-center justify-center gap-2 py-3 px-6 rounded-lg font-semibold transition-all ${
                                            isSpeaking
                                                ? 'bg-red-600 hover:bg-red-700 text-white'
                                                : 'bg-gradient-to-r from-red-600 to-yellow-500 hover:from-red-700 hover:to-yellow-600 text-white'
                                        } disabled:opacity-50 disabled:cursor-not-allowed`}
                                    >
                                        {isSpeaking ? (
                                            <>
                                                <Square size={20} />
                                                Stoppen
                                            </>
                                        ) : (
                                            <>
                                                <Volume2 size={20} />
                                                Abspielen
                                            </>
                                        )}
                                    </button>

                                    <button
                                        onClick={() => setShowSettings(!showSettings)}
                                        className="px-4 py-3 border-2 border-gray-300 rounded-lg hover:bg-gray-50 transition-all"
                                    >
                                        <Settings size={20} />
                                    </button>
                                </div>

                                {showSettings && (
                                    <div className="bg-gray-50 rounded-lg p-4 space-y-4 border-2 border-gray-200">
                                        <h3 className="font-semibold text-gray-800 mb-3">Einstellungen</h3>
                                        
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Stimme {voices.length > 0 ? `(${voices.length} verfügbar)` : '(Wird geladen...)'}
                                            </label>
                                            {voices.length > 0 ? (
                                                <select
                                                    value={selectedVoice}
                                                    onChange={(e) => setSelectedVoice(e.target.value)}
                                                    className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-200"
                                                >
                                                    {voices.map((voice) => (
                                                        <option key={voice.name} value={voice.name}>
                                                            {voice.name} ({voice.lang})
                                                        </option>
                                                    ))}
                                                </select>
                                            ) : (
                                                <div className="text-sm text-gray-500 p-2 bg-yellow-50 border border-yellow-200 rounded">
                                                    Keine deutschen Stimmen gefunden. Die Standard-Stimme wird verwendet.
                                                </div>
                                            )}
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Geschwindigkeit: {rate.toFixed(1)}x
                                            </label>
                                            <input
                                                type="range"
                                                min="0.5"
                                                max="2"
                                                step="0.1"
                                                value={rate}
                                                onChange={(e) => setRate(parseFloat(e.target.value))}
                                                className="w-full"
                                            />
                                            <div className="flex justify-between text-xs text-gray-500 mt-1">
                                                <span>Langsam</span>
                                                <span>Schnell</span>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Tonhöhe: {pitch.toFixed(1)}
                                            </label>
                                            <input
                                                type="range"
                                                min="0.5"
                                                max="2"
                                                step="0.1"
                                                value={pitch}
                                                onChange={(e) => setPitch(parseFloat(e.target.value))}
                                                className="w-full"
                                            />
                                            <div className="flex justify-between text-xs text-gray-500 mt-1">
                                                <span>Tief</span>
                                                <span>Hoch</span>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                                    <p className="text-sm text-blue-800">
                                        <strong>Tipps:</strong>
                                    </p>
                                    <ul className="text-sm text-blue-800 mt-2 space-y-1 list-disc list-inside">
                                        <li>Stellen Sie sicher, dass Ihr Gerät nicht stummgeschaltet ist</li>
                                        <li>Chrome und Edge bieten die besten deutschen Stimmen</li>
                                        <li>Bei einigen Browsern müssen Sie zuerst mit der Seite interagieren</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GermanTTS />);
    </script>
</body>
</html>
